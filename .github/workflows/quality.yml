name: Quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m compileall -q bot.py config.py api cogs database runtime scripts services tests utils

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t ayla-backend-ci .
      - run: docker run --rm ayla-backend-ci python -c 'import cogs.internal_api, database.users, runtime.bots'
