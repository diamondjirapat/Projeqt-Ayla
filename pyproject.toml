[tool.ruff]
target-version = "py313"
# No enforced line limit: lint rules exclude E501, and 320 is the widest ruff format allows.
line-length = 320
exclude = ["frontend", "static"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
